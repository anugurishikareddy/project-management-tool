<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Management Tool</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f9;
            color: #222;
        }

        header {
            background: #263238;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin-bottom: 8px;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 25px auto;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: center;
        }

        .card h2 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .section {
            background: white;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .section h2 {
            margin-bottom: 20px;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        button {
            padding: 11px 18px;
            border: none;
            border-radius: 6px;
            background: #1976d2;
            color: white;
            cursor: pointer;
            margin-right: 8px;
        }

        button:hover {
            background: #125aa0;
        }

        .project,
        .task,
        .comment,
        .notification {
            border: 1px solid #ddd;
            padding: 15px;
            margin-bottom: 12px;
            border-radius: 7px;
            background: #fafafa;
        }

        .project h3,
        .task h3 {
            margin-bottom: 8px;
        }

        .status {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 15px;
            background: #e0e0e0;
            margin-top: 8px;
        }

        .success {
            color: green;
            margin-top: 10px;
        }

        .error {
            color: red;
            margin-top: 10px;
        }

        @media (max-width: 800px) {
            .cards {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 500px) {
            .cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Project Management Tool</h1>
    <p>Manage Projects, Tasks, Comments and Notifications</p>
</header>

<div class="container">

    <!-- DASHBOARD -->

    <div class="cards">

        <div class="card">
            <h2 id="projectCount">0</h2>
            <p>Projects</p>
        </div>

        <div class="card">
            <h2 id="taskCount">0</h2>
            <p>Tasks</p>
        </div>

        <div class="card">
            <h2 id="commentCount">0</h2>
            <p>Comments</p>
        </div>

        <div class="card">
            <h2 id="notificationCount">0</h2>
            <p>Notifications</p>
        </div>

    </div>


    <!-- REGISTER -->

    <div class="section">

        <h2>Register User</h2>

        <input
            type="text"
            id="registerUsername"
            placeholder="Username"
        >

        <input
            type="email"
            id="registerEmail"
            placeholder="Email"
        >

        <input
            type="password"
            id="registerPassword"
            placeholder="Password"
        >

        <button onclick="registerUser()">
            Register
        </button>

        <p id="registerMessage"></p>

    </div>


    <!-- LOGIN -->

    <div class="section">

        <h2>Login</h2>

        <input
            type="text"
            id="loginUsername"
            placeholder="Username"
        >

        <input
            type="password"
            id="loginPassword"
            placeholder="Password"
        >

        <button onclick="loginUser()">
            Login
        </button>

        <p id="loginMessage"></p>

    </div>


    <!-- CREATE PROJECT -->

    <div class="section">

        <h2>Create Project</h2>

        <input
            type="text"
            id="projectName"
            placeholder="Project Name"
        >

        <textarea
            id="projectDescription"
            placeholder="Project Description"
        ></textarea>

        <input
            type="text"
            id="projectUsername"
            placeholder="Owner Username"
            value="rishika_new"
        >

        <button onclick="createProject()">
            Create Project
        </button>

        <p id="projectMessage"></p>

    </div>


    <!-- PROJECT LIST -->

    <div class="section">

        <h2>Projects</h2>

        <button onclick="loadProjects()">
            Refresh Projects
        </button>

        <div id="projects"></div>

    </div>


    <!-- CREATE TASK -->

    <div class="section">

        <h2>Create Task</h2>

        <input
            type="number"
            id="taskProject"
            placeholder="Project ID"
        >

        <input
            type="text"
            id="taskTitle"
            placeholder="Task Title"
        >

        <textarea
            id="taskDescription"
            placeholder="Task Description"
        ></textarea>

        <select id="taskStatus">
            <option value="todo">To Do</option>
            <option value="progress">In Progress</option>
            <option value="done">Done</option>
        </select>

        <select id="taskPriority">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
        </select>

        <input
            type="date"
            id="taskDueDate"
        >

        <button onclick="createTask()">
            Create Task
        </button>

        <p id="taskMessage"></p>

    </div>


    <!-- TASK LIST -->

    <div class="section">

        <h2>Tasks</h2>

        <button onclick="loadTasks()">
            Refresh Tasks
        </button>

        <div id="tasks"></div>

    </div>


    <!-- COMMENTS -->

    <div class="section">

        <h2>Add Comment</h2>

        <input
            type="number"
            id="commentTask"
            placeholder="Task ID"
        >

        <input
            type="text"
            id="commentUsername"
            placeholder="Username"
            value="rishika_new"
        >

        <textarea
            id="commentContent"
            placeholder="Write your comment..."
        ></textarea>

        <button onclick="addComment()">
            Add Comment
        </button>

        <p id="commentMessage"></p>

        <hr>

        <h2 style="margin-top:20px;">
            Comments
        </h2>

        <button onclick="loadComments()">
            Refresh Comments
        </button>

        <div id="comments"></div>

    </div>


    <!-- NOTIFICATIONS -->

    <div class="section">

        <h2>Create Notification</h2>

        <input
            type="text"
            id="notificationUsername"
            placeholder="Username"
            value="rishika_new"
        >

        <textarea
            id="notificationMessageInput"
            placeholder="Notification message"
        ></textarea>

        <button onclick="createNotification()">
            Create Notification
        </button>

        <p id="notificationMessage"></p>

        <hr>

        <h2 style="margin-top:20px;">
            Notifications
        </h2>

        <button onclick="loadNotifications()">
            Refresh Notifications
        </button>

        <div id="notifications"></div>

    </div>


    <!-- WEBSOCKET -->

    <div class="section">

        <h2>WebSocket Test</h2>

        <button onclick="testWebSocket()">
            Test WebSocket Endpoint
        </button>

        <p id="websocketResult"></p>

    </div>

</div>


<script>

const API = "/api/";


/* =========================
   REGISTER
========================= */

async function registerUser() {

    const username =
        document.getElementById("registerUsername").value;

    const email =
        document.getElementById("registerEmail").value;

    const password =
        document.getElementById("registerPassword").value;

    try {

        const response = await fetch(
            API + "register/",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    username,
                    email,
                    password
                })
            }
        );

        const data = await response.json();

        const message =
            document.getElementById("registerMessage");

        if (response.ok) {

            message.className = "success";
            message.textContent =
                data.message;

        } else {

            message.className = "error";
            message.textContent =
                data.error;

        }

    } catch (error) {

        document.getElementById(
            "registerMessage"
        ).textContent = error;

    }
}


/* =========================
   LOGIN
========================= */

async function loginUser() {

    const username =
        document.getElementById("loginUsername").value;

    const password =
        document.getElementById("loginPassword").value;

    try {

        const response = await fetch(
            API + "login/",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    username,
                    password
                })
            }
        );

        const data = await response.json();

        const message =
            document.getElementById("loginMessage");

        if (response.ok) {

            message.className = "success";

            message.textContent =
                "Welcome " + data.username;

        } else {

            message.className = "error";

            message.textContent =
                data.error;

        }

    } catch (error) {

        document.getElementById(
            "loginMessage"
        ).textContent = error;

    }
}


/* =========================
   CREATE PROJECT
========================= */

async function createProject() {

    const name =
        document.getElementById("projectName").value;

    const description =
        document.getElementById("projectDescription").value;

    const username =
        document.getElementById("projectUsername").value;

    try {

        const response = await fetch(
            API + "projects/",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    name,
                    description,
                    username
                })
            }
        );

        const data = await response.json();

        const message =
            document.getElementById("projectMessage");

        if (response.ok) {

            message.className = "success";

            message.textContent =
                data.message;

            loadProjects();

        } else {

            message.className = "error";

            message.textContent =
                data.error;

        }

    } catch (error) {

        document.getElementById(
            "projectMessage"
        ).textContent = error;

    }
}


/* =========================
   LOAD PROJECTS
========================= */

async function loadProjects() {

    try {

        const response =
            await fetch(API + "projects/");

        const data =
            await response.json();

        document.getElementById(
            "projectCount"
        ).textContent = data.length;

        const container =
            document.getElementById("projects");

        container.innerHTML = "";

        data.forEach(project => {

            container.innerHTML += `

                <div class="project">

                    <h3>
                        ${project.name}
                    </h3>

                    <p>
                        ${project.description || ""}
                    </p>

                    <p>
                        <b>Project ID:</b>
                        ${project.id}
                    </p>

                    <p>
                        <b>Owner:</b>
                        ${project.owner}
                    </p>

                </div>

            `;

        });

    } catch (error) {

        console.error(error);

    }
}


/* =========================
   CREATE TASK
========================= */

async function createTask() {

    const project =
        document.getElementById("taskProject").value;

    const title =
        document.getElementById("taskTitle").value;

    const description =
        document.getElementById("taskDescription").value;

    const status =
        document.getElementById("taskStatus").value;

    const priority =
        document.getElementById("taskPriority").value;

    const due_date =
        document.getElementById("taskDueDate").value;

    try {

        const response = await fetch(
            API + "tasks/",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    project,
                    title,
                    description,
                    status,
                    priority,
                    due_date: due_date || null
                })
            }
        );

        const data =
            await response.json();

        const message =
            document.getElementById("taskMessage");

        if (response.ok) {

            message.className = "success";

            message.textContent =
                data.message;

            loadTasks();

        } else {

            message.className = "error";

            message.textContent =
                data.error;

        }

    } catch (error) {

        document.getElementById(
            "taskMessage"
        ).textContent = error;

    }
}


/* =========================
   LOAD TASKS
========================= */

async function loadTasks() {

    try {

        const response =
            await fetch(API + "tasks/");

        const data =
            await response.json();

        document.getElementById(
            "taskCount"
        ).textContent = data.length;

        const container =
            document.getElementById("tasks");

        container.innerHTML = "";

        data.forEach(task => {

            container.innerHTML += `

                <div class="task">

                    <h3>
                        ${task.title}
                    </h3>

                    <p>
                        ${task.description || ""}
                    </p>

                    <p>
                        <b>Project:</b>
                        ${task.project_name}
                    </p>

                    <p>
                        <b>Priority:</b>
                        ${task.priority}
                    </p>

                    <span class="status">
                        ${task.status}
                    </span>

                    <p>
                        <b>Due:</b>
                        ${task.due_date || "No due date"}
                    </p>

                </div>

            `;

        });

    } catch (error) {

        console.error(error);

    }
}


/* =========================
   ADD COMMENT
========================= */

async function addComment() {

    const task_id =
        document.getElementById("commentTask").value;

    const content =
        document.getElementById("commentContent").value;

    const username =
        document.getElementById("commentUsername").value;

    try {

        const response = await fetch(
            API + "comments/",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    task_id,
                    content,
                    username
                })
            }
        );

        const data =
            await response.json();

        const message =
            document.getElementById("commentMessage");

        if (response.ok) {

            message.className = "success";

            message.textContent =
                data.message;

            loadComments();

        } else {

            message.className = "error";

            message.textContent =
                data.error;

        }

    } catch (error) {

        document.getElementById(
            "commentMessage"
        ).textContent = error;

    }
}


/* =========================
   LOAD COMMENTS
========================= */

async function loadComments() {

    try {

        const response =
            await fetch(API + "comments/");

        const data =
            await response.json();

        document.getElementById(
            "commentCount"
        ).textContent = data.length;

        const container =
            document.getElementById("comments");

        container.innerHTML = "";

        data.forEach(comment => {

            container.innerHTML += `

                <div class="comment">

                    <b>
                        ${comment.user}
                    </b>

                    <p>
                        ${comment.content}
                    </p>

                    <small>
                        Task:
                        ${comment.task_title}
                    </small>

                </div>

            `;

        });

    } catch (error) {

        console.error(error);

    }
}


/* =========================
   CREATE NOTIFICATION
========================= */

async function createNotification() {

    const username =
        document.getElementById(
            "notificationUsername"
        ).value;

    const messageText =
        document.getElementById(
            "notificationMessageInput"
        ).value;

    try {

        const response = await fetch(
            API + "notifications/",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    username,
                    message: messageText
                })
            }
        );

        const data =
            await response.json();

        const message =
            document.getElementById(
                "notificationMessage"
            );

        if (response.ok) {

            message.className = "success";

            message.textContent =
                data.message;

            loadNotifications();

        } else {

            message.className = "error";

            message.textContent =
                data.error;

        }

    } catch (error) {

        document.getElementById(
            "notificationMessage"
        ).textContent = error;

    }
}


/* =========================
   LOAD NOTIFICATIONS
========================= */

async function loadNotifications() {

    try {

        const response =
            await fetch(API + "notifications/");

        const data =
            await response.json();

        document.getElementById(
            "notificationCount"
        ).textContent = data.length;

        const container =
            document.getElementById(
                "notifications"
            );

        container.innerHTML = "";

        data.forEach(notification => {

            container.innerHTML += `

                <div class="notification">

                    <b>
                        ${notification.user}
                    </b>

                    <p>
                        ${notification.message}
                    </p>

                    <small>
                        Read:
                        ${notification.is_read}
                    </small>

                </div>

            `;

        });

    } catch (error) {

        console.error(error);

    }
}


/* =========================
   WEBSOCKET TEST
========================= */

async function testWebSocket() {

    try {

        const response =
            await fetch(
                "/websocket-test/"
            );

        const data =
            await response.json();

        document.getElementById(
            "websocketResult"
        ).textContent =
            data.message;

    } catch (error) {

        document.getElementById(
            "websocketResult"
        ).textContent =
            "WebSocket test failed";

    }
}


/* =========================
   LOAD EVERYTHING
========================= */

window.onload = function() {

    loadProjects();
    loadTasks();
    loadComments();
    loadNotifications();

};

</script>

</body>
</html>
